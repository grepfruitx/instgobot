name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build (cgo, linux/amd64 — matches the VPS)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o bot ./cmd/bot

      - uses: actions/upload-artifact@v4
        with:
          name: bot-binary
          path: bot

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bot-binary

      - name: Upload binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "bot"
          target: ${{ secrets.VPS_PROJECT_PATH }}
          strip_components: 0

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            chmod +x ${{ secrets.VPS_PROJECT_PATH }}/bot
            systemctl restart instgobot
