name: Deploy to VPS

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - run: go vet ./...

      - run: go test -race ./...

  build:
    name: Build binary
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build (cgo, linux/amd64 — matches the VPS)
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o bot ./cmd/bot

      - uses: actions/upload-artifact@v4
        with:
          name: bot-binary
          path: bot

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bot-binary

      - name: Upload binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "bot"
          target: ${{ secrets.VPS_PROJECT_PATH }}/release
          strip_components: 0

      - name: Swap binary and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.VPS_PROJECT_PATH }}
            chmod +x release/bot
            if [ -f bot ]; then cp -f bot bot.prev; fi
            mv -f release/bot bot
            systemctl restart instgobot
            sleep 10
            if ! systemctl is-active --quiet instgobot; then
              echo "new binary failed to start, rolling back"
              if [ -f bot.prev ]; then mv -f bot.prev bot; fi
              systemctl restart instgobot
              exit 1
            fi
